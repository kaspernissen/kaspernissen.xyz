# Builds and deploys exactly what is committed.
#
# No fetchers run here. The content in src/content/ is the source of truth, so
# a deploy is reproducible: the same commit gives the same site, and reverting
# a bad change is a git revert rather than an archaeology exercise. Upstream is
# pulled in by .github/workflows/refresh.yml, which opens a pull request.
name: Build & deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # No YOUTUBE_API_KEY: nothing here talks to YouTube any more.
          #
          # Decks and photo originals are served from S3, not from this repo.
          # Both live in one bucket under a prefix, so
          # these URLs must carry it — the bucket root holds nothing.
          PUBLIC_DECK_BASE_URL: https://kasper-nissen-presentations.s3.eu-west-1.amazonaws.com/decks
          # Without this the build falls back to /speakers, which is gitignored,
          # so every "Download original" would 404 on the deployed site.
          PUBLIC_PHOTO_BASE_URL: https://kasper-nissen-presentations.s3.eu-west-1.amazonaws.com/photos
          PUBLIC_BADGE_BASE_URL: https://kasper-nissen-presentations.s3.eu-west-1.amazonaws.com/badges
          PUBLIC_BLOG_IMAGE_BASE_URL: https://kasper-nissen-presentations.s3.eu-west-1.amazonaws.com/blog
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
