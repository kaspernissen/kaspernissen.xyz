<!doctype html>
<meta charset="utf-8" />
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<style>
  /* Every colour here is copied from src/styles/global.css (@theme) and
     src/components/Hero.astro. Keep them in step with the site. */
  :root {
    --bg: #0c0a09;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --pink: #ec4899;
    --orange: #fb923c;
    --cyan: #22d3ee;
    --yellow: #facc15;
    --violet: #7c3aed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: __W__px; height: __H__px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-feature-settings: 'cv11', 'ss01';
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* Confetti and squiggle sit behind everything, as in the hero. */
  #decor { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  #decor .dot { position: absolute; border-radius: 9999px; }

  #stage {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; align-items: center; gap: __GAP__px;
    padding: __PAD__px;
    /* banner keeps a wide left gutter: LinkedIn lays the profile photo over
       the bottom-left of a profile cover, so anything put there is hidden. */
    padding-left: __PADL__px;
  }
  #stage.flip { flex-direction: row-reverse; }
  #stage.stack { flex-direction: column; align-items: stretch; justify-content: space-between; }

  /* The inner box is what gets measured when the type is auto-fitted, so it
     must be free to be taller than the frame before shrinking starts. */
  #copy {
    flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; align-items: center; overflow: hidden;
  }
  #stage:not(.stack) #copy { align-self: stretch; }
  /* Stacked, the headline sits under the top edge rather than floating in the
     middle of the gap between it and the mascot below. */
  #stage.stack #copy { align-items: flex-start; flex: 0 1 auto; }
  #copyinner { width: 100%; }

  /* Event logos come in their own colours; flattened to the ink colour so
     they sit on the dark ground like the rest of the type. */
  #logo {
    display: block;
    height: __LOGOH__px; width: auto;
    filter: brightness(0) invert(1);
    margin-bottom: __KICKGAP__px;
  }

  /* --logo-colour: the logo's own colours, for a dark-ground variant. */
  #logo.colour { filter: none; }

  #logo.corner {
    position: absolute; z-index: 2;
    top: __PAD__px; right: __PADR__px;
    margin: 0;
  }

  #kicker {
    font-size: __KICKER__px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: __KICKGAP__px;
  }

  h1 {
    font-size: __FONT__px;
    font-weight: 800;
    letter-spacing: -0.025em;   /* tracking-tight */
    line-height: 1.08;
    text-wrap: balance;
  }

  /* The hero's highlight: an inline-block rounded chip, slightly rotated.
     nowrap matters — a chip allowed to break across lines stops reading as a
     highlight on a word and becomes a big coloured box. The type auto-fits
     instead, so a long chip shrinks the headline rather than wrapping. */
  .chip {
    display: inline-block;
    white-space: nowrap;
    border-radius: __RADIUS__px;
    padding: __CHIPY__px __CHIPX__px;
  }
  .chip.pink   { background: var(--pink);   color: #fff; }
  .chip.orange { background: var(--orange); color: var(--bg); }
  .chip.cyan   { background: var(--cyan);   color: var(--bg); }
  .chip.yellow { background: var(--yellow); color: var(--bg); }
  .chip.violet { background: var(--violet); color: #fff; }
  .chip.a { transform: rotate(-1deg); }
  .chip.b { transform: rotate(1.5deg); }

  /* Anchored to the bottom of the frame and allowed to run off it, the way
     HeroCartoon is anchored to the hero's bottom edge. The mascots are cut off
     square at the chest, and that flat edge — plus the bar of yellow shadow
     under it — is obvious when the figure floats clear of the frame. */
  #mascot {
    flex: 0 0 auto;
    display: flex; justify-content: center;
    align-self: flex-end;
    margin-bottom: -__MASCOTDROP__px;
  }
  #mascot { position: relative; }
  /* --bubble: a speech bubble from the mascot, up and to the side of its
     head, with a tail pointing at the face. Same hard yellow shadow. */
  #bubble {
    position: absolute; z-index: 3;
    top: __BUBTOP__%; right: __BUBRIGHT__%;
    white-space: nowrap;
    background: var(--ink); color: var(--bg);
    font-size: __BUBF__px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
    padding: 0.5em 0.75em;
    border-radius: 0.6em;
    transform: rotate(-3deg);
    filter: drop-shadow(__SHX__px __SHY__px 0 rgba(252, 204, 21, 0.85));
  }
  /* Tail hangs off the bottom edge, pointing down at the head below. */
  #bubble::after {
    content: ""; position: absolute;
    right: 22%; bottom: -0.6em;
    border-style: solid;
    border-width: 0.7em 0.35em 0 0.35em;
    border-color: var(--ink) transparent transparent transparent;
    transform: skewX(-25deg);
  }
  #stage.flip #bubble { right: auto; left: __BUBRIGHT__%; transform: rotate(3deg); }
  #stage.flip #bubble::after { right: auto; left: 22%; transform: skewX(25deg); }
  /* --bubble-pos left: the bubble enters from the left edge, as if someone
     off-frame is saying it. Top-left, tail pointing out to the left. */
  #bubble.left { top: __PAD__px; left: __PAD__px; right: auto; transform: rotate(-2deg); }
  #bubble.left::after {
    right: auto; left: -0.6em; bottom: 0.35em;
    border-width: 0.35em 0.7em 0.35em 0;
    border-color: transparent var(--ink) transparent transparent;
    transform: skewY(20deg);
  }
  /* Room under a left bubble so the headline doesn't run into it. */
  #stage.bubbleleft { padding-top: __BUBPADTOP__px; }

  /* --wordmark: the site's "kasper." wordmark (NavBar.astro: font-extrabold
     tracking-tight), bottom left. */
  #wordmark {
    position: absolute; z-index: 2;
    left: __PAD__px; bottom: __WMBOTTOM__px;
    font-size: __WMF__px; font-weight: 800; letter-spacing: -0.025em;
    color: var(--ink);
  }
  #mascot img {
    display: block;
    width: __MASCOTW__px;
    height: auto;
    transform: rotate(1deg);
    /* .cartoon-shadow from global.css */
    filter: drop-shadow(__SHX__px __SHY__px 0 rgba(252, 204, 21, 0.85));
  }

  /* A photo in the mascot's slot. It stays inside the frame (a photo has no
     square-cut chest to hide), takes whatever room the copy leaves, and wears
     the same hard yellow offset shadow as the cartoon. */
  #photo { display: flex; min-height: 0; min-width: 0; }
  #stage.stack.hasphoto { justify-content: flex-start; }
  #stage.stack #photo { flex: 1 1 0; }
  #stage:not(.stack) #photo { flex: 0 0 50%; align-self: stretch; }
  #photo img {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    border-radius: __PHOTOR__px;
    transform: rotate(-1.5deg);
    box-shadow: __PHOTOSH__px calc(__PHOTOSH__px * 1.2) 0 rgba(252, 204, 21, 0.85);
  }

  /* --logo2: a second logo in its own colours, under the corner logo. */
  #logo2 {
    position: absolute; z-index: 2;
    top: __LOGO2TOP__px; right: __PADR__px;
    height: __LOGO2H__px; width: auto;
  }

  /* --stamp: an inked rubber stamp, tilted, bottom left under the copy. */
  #stamp {
    position: absolute; z-index: 3;
    left: __PAD__px; bottom: __PAD__px;
    padding: 0.35em 0.8em;
    font-size: __STAMPF__px; font-weight: 800;
    letter-spacing: 0.16em; text-transform: uppercase;
    border: 0.16em solid currentColor;
    outline: 0.08em solid currentColor; outline-offset: 0.18em;
    border-radius: 0.3em;
    transform: rotate(-7deg);
    color: var(--yellow);
  }
  #stamp.right { left: auto; bottom: auto; right: __PADR__px; top: 48%; font-size: calc(__STAMPF__px * 0.8); }
  #stamp.pink { color: var(--pink); }
  #stamp.cyan { color: var(--cyan); }
  #stamp.orange { color: var(--orange); }
  #stamp.violet { color: var(--violet); }
</style>
<body>
  <div id="decor">__DECOR__</div>
  __CORNERLOGO__
  __LOGO2HTML__
  __STAMPHTML__
  __BUBBLEHTML__
  __WORDMARKHTML__
  <div id="stage" class="__STAGECLASS__">
    <div id="copy"><div id="copyinner">
      __LOGOHTML__
      __KICKERHTML__
      <h1>__HEADLINE__</h1>
    </div></div>
    __MASCOTHTML__
  </div>
</body>
