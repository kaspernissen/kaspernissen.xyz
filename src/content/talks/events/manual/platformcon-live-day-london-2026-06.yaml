abstract: "AI introduces new challenges for platform engineering teams. Agent-based systems are harder to reason about than traditional services: they are non-deterministic, invoke tools dynamically, generate variable load, and make decisions that are difficult to reconstruct later. When something goes wrong, existing debugging and operational practices often fall short.\n\n- Learn more about this session: https://platformcon.com/sessions/observability-as-a-foundation-for-ai-enabled-platforms-ldn\n- Get your copy of the book, Thinking in Platforms: https://weaveintelligence.io/thinking-in-platforms-book"
