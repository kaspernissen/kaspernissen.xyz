title: "Beyond “Supports OpenTelemetry”: A Maturity Model for Cloud-Native Observability -Kasper Borg Nissen"
event: Cloud Native Summit 2026
event_url: https://cloudnativesummit.de/
date: 2026-06-30
location: Munich, Germany
role: speaker
abstract: |
  According to the latest CNCF survey, nearly 49% of organizations now run OpenTelemetry in production, yet “supports OpenTelemetry” has become a vague claim that hides large differences in quality, usability, and long-term maintainability.

  This talk introduces a community-driven OpenTelemetry Support Maturity Model that moves beyond checkboxes and helps evaluate how well OpenTelemetry is integrated and evolved. The model breaks maturity down across seven dimensions, providing a structured way to reason about real-world OpenTelemetry support.
