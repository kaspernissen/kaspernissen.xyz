title: "Keynote: Unity in Diversity: A Decade of Inclusive Growth in the Cloud Native Community"
event: "KubeCon + CloudNativeCon Europe 2024"
event_url: "https://events.linuxfoundation.org/kubecon-cloudnativecon-europe-2024/"
date: 2024-03-22
location: "Paris, France"
abstract: |-
  Join this intriguing panel of community members while we celebrate a decade of inclusive evolution in the Cloud Native community. Explore the diverse contributions that extend beyond code, recognizing the vital roles of local ambassadors, glossary translations, and events like Kubernetes Community Days (KCDs) in making the Cloud Native experience accessible globally. Discover how we've worked to remove barriers for individuals with disabilities, or in an underrepresented group ensuring everyone, regardless of background or ability, has a place in our community.
  Vive la diversité as we continue shaping the future together.
