title: "Golden Paths for Async Workflows: Dapr Meets OpenTelemetry"
event: KCD Suisse Romande 2025
event_url: https://cloud-native-romandy.ch/
date: 2025-12-04
end_date: 2025-12-05
location: Geneva, Switzerland
role: speaker
abstract: |-
  Async workflows power modern microservices, but they can be notoriously hard to observe. In this talk, we show how two CNCF projects - Dapr, for developer-friendly building blocks, and OpenTelemetry, for unified observability - create a golden path that bridges developer productivity and platform reliability.

  We’ll start by using Dapr Workflows and Pub/Sub to connect and orchestrate services without boilerplate. Then we’ll add the OpenTelemetry Operator for no-touch instrumentation, instantly delivering traces, metrics, and logs - even across asynchronous boundaries.

  You’ll see current OpenTelemetry capabilities for tracking async requests end-to-end, where the gaps are today, and practical ways to correlate events in complex workflows. Through a live demo, we’ll prove that with the right abstractions, shipping features fast and observing systems deeply can go hand in hand.
