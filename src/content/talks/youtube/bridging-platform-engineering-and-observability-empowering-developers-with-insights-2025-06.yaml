abstract: "Platform engineers often face the challenge of providing developers with effective tools for managing application observability. Observability sprawl - characterized by multiple tools, disconnected dashboards, and inconsistent instrumentation - can lead to difficulties in troubleshooting, increased cognitive load, and reduced productivity.\n\nIn this talk, Kasper Borg Nissen will demonstrate how platform engineering principles can help bridge this gap by creating developer-friendly observability abstractions. The session will cover how OpenTelemetry can be used for auto-instrumentation, manual instrumentation, and standardizing semantic conventions for telemetry signals.\n"
