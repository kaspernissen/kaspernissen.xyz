abstract: |-
  An autonomous agent will do exactly what its tools let it do, and the set of things its tools allow is almost never the set anyone deliberately chose. Sooner or later someone asks what the agent did, and who allowed it.

  This talk works through that question as a platform problem: decide what an agent may do, trace what it actually did, and prove it afterwards from the trace. Using a live demo of a fictional insurer, it shows how platform teams can put guardrails around agents with workload identity, policy and tool gateways, and use OpenTelemetry to record reasoning, tool calls and policy decisions as evidence an auditor can follow.

  The first AAIF Aarhus meetup, hosted by Eficode. The talk builds on the KubeCon + CloudNativeCon North America 2026 session with William Rizzo.
