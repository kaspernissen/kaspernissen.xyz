title: "Observability at the Edge: State of OpenTelemetry in Kubernetes Ingress Controllers"
event: "Observability Day"
event_url: https://events.linuxfoundation.org/kubecon-cloudnativecon-europe/co-located-events/cncf-hosted-co-located-events-overview/
