abstract: |-
  Join the awesome Lunar team - Kasper Nissen and Bjørn Hald Sørensen, alongside Snyk's Matt Jarvis to talk about their open source project - a Prometheus Exporter for Snyk.

  If you are looking for a quick and easy way to export your Snyk scans into Prometheus, check out the snyk_exporter project by the Lunar team.

  The Prometheus exporter for Snyk is written in Go and allows for exporting scanning data into Prometheus by scraping the Snyk HTTP API, and then you can visualize your Snyk scans with Prometheus quickly and easily.
